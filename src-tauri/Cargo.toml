[package]
name = "fluent-iptv"
version = "0.1.0"
description = "Fluent IPTV - Tauri + ffmpeg live TV player for the iptv-org playlist"
edition = "2021"
rust-version = "1.82"

# The Tauri application shell.
[[bin]]
name = "fluent-iptv"
path = "src/main.rs"

# Standalone media server (no Tauri). Used for `npm run dev` in a plain browser
# and for the integration tests that exercise the ffmpeg -> WebSocket pipeline.
[[bin]]
name = "media-server"
path = "src/bin/media_server.rs"

[lib]
name = "fluent_iptv_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# A second launch (double-click, repeated start) must focus the running window
# instead of starting another backend and another window.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws", "json", "tokio"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "charset"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
once_cell = "1"
thiserror = "2"

[features]
# Keeps `cargo test` fast; tauri's custom protocol is only needed for the app.
default = []
